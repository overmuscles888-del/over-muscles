<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - Over Muscles</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandDark: '#000000',
            brandGreen: '#A8E630',
          }
        }
      }
    }
  </script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-brandDark text-white font-sans selection:bg-brandGreen selection:text-black">

  <!-- شاشة تسجيل الدخول (الباسورد: NOUR3011) -->
  <div id="loginScreen" class="fixed inset-0 bg-black flex items-center justify-center z-50">
    <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl w-full max-w-md shadow-2xl text-center">
      <h2 class="text-2xl font-black text-brandGreen mb-4">لوحة التحكم السحابية</h2>
      <p class="text-zinc-400 text-sm mb-6">الرجاء إدخال رمز المرور للوصول</p>
      <input type="password" id="adminPassword" placeholder="كلمة المرور" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-white mb-4 focus:outline-none focus:border-brandGreen">
      <button onclick="checkPassword()" class="w-full bg-brandGreen text-black font-bold py-3 rounded-xl hover:bg-[#95ce28] transition">دخول</button>
    </div>
  </div>

  <!-- محتوى لوحة التحكم (مخفي لحين إدخال الباسورد الصح) -->
  <div id="adminPanel" class="hidden max-w-4xl mx-auto px-4 py-12">
    <div class="flex justify-between items-center mb-10 pb-6 border-b border-zinc-800">
      <h1 class="text-3xl font-black text-brandGreen">لوحة تحكم Over Muscles</h1>
      <a href="index.html" target="_blank" class="bg-zinc-900 border border-zinc-800 px-4 py-2 rounded-xl text-sm hover:border-brandGreen transition">عرض الموقع الحقيقي ↗</a>
    </div>

    <!-- 1. تعديل إعدادات الهيرو والرئيسية -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 mb-8 shadow-xl">
      <h3 class="text-xl font-bold mb-4 text-brandGreen">تعديل الواجهة الرئيسية (الهيرو & النصوص)</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-zinc-400 mb-2">عنوان الهيرو الرئيسي:</label>
          <input type="text" id="heroTitleInput" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2 text-white">
        </div>
        <div>
          <label class="block text-sm text-zinc-400 mb-2">النص الفرعي (السبتايتل):</label>
          <textarea id="heroSubtitleInput" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2 text-white h-20"></textarea>
        </div>
        <div>
          <label class="block text-sm text-zinc-400 mb-2">رفع صورة الهيرو الجديدة من الجهاز:</label>
          <input type="file" id="heroImageFile" accept="image/*" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2 text-zinc-400 file:bg-brandGreen file:text-black file:border-0 file:rounded-lg file:px-3 file:py-1 file:cursor-pointer">
        </div>
        <div>
          <label class="block text-sm text-zinc-400 mb-2">رقم واتساب الأعمال (مثال: 201000000000):</label>
          <input type="text" id="whatsappInput" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2 text-white">
        </div>
        <div>
          <label class="block text-sm text-zinc-400 mb-2">نص قسم (معلومات عنا / من نحن):</label>
          <textarea id="aboutTextInput" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2 text-white h-24"></textarea>
        </div>
        <button onclick="saveSettings()" class="bg-brandGreen text-black font-bold px-6 py-3 rounded-xl hover:bg-[#95ce28] transition">حفظ إعدادات الموقع</button>
      </div>
    </div>

    <!-- 2. إضافة منتجات لا نهائية (رفع مباشر من الجهاز) -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl">
      <h3 class="text-xl font-bold mb-4 text-brandGreen">إضافة منتج جديد للموقع</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-zinc-400 mb-2">اسم المنتج:</label>
          <input type="text" id="productName" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2 text-white">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-zinc-400 mb-2">السعر (ج.م):</label>
            <input type="text" id="productPrice" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2 text-white">
          </div>
          <div>
            <label class="block text-sm text-zinc-400 mb-2">نسبة الخصم (اختياري):</label>
            <input type="text" id="productDiscount" placeholder="مثال: 20" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2 text-white">
          </div>
        </div>
        <div>
          <label class="block text-sm text-zinc-400 mb-2">صورة المنتج (اختر من الجهاز):</label>
          <input type="file" id="productImageFile" accept="image/*" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2 text-zinc-400 file:bg-brandGreen file:text-black file:border-0 file:rounded-lg file:px-3 file:py-1 file:cursor-pointer">
        </div>
        <div>
          <label class="block text-sm text-zinc-400 mb-2">تفاصيل المنتج (الطعم، الاستخدام، إلخ):</label>
          <textarea id="productDetails" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-2 text-white h-20"></textarea>
        </div>
        <button onclick="addProduct()" class="w-full bg-brandGreen text-black font-bold py-3 rounded-xl hover:bg-[#95ce28] transition">إضافة المنتج للموقع مباشرة</button>
      </div>
    </div>
  </div>

  <!-- سكربت لوحة التحكم والاتصال اللحظي -->
  <script>
    const SUPABASE_URL = 'https://bmwhkfyvqbfapdryuzk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sZTxkrHj9qWsjyoBnZUJPQ_ljP3QC9q';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function checkPassword() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === 'NOUR3011') {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadCurrentSettings();
      } else {
        alert('كلمة المرور غير صحيحة!');
      }
    }

    async function loadCurrentSettings() {
      const { data } = await _supabase.from('site_settings').select('*');
      if (data) {
        data.forEach(item => {
          if (item.key === 'hero_title') document.getElementById('heroTitleInput').value = item.value;
          if (item.key === 'hero_subtitle') document.getElementById('heroSubtitleInput').value = item.value;
          if (item.key === 'whatsapp_number') document.getElementById('whatsappInput').value = item.value;
          if (item.key === 'about_text') document.getElementById('aboutTextInput').value = item.value;
        });
      }
    }

    async function saveSettings() {
      const heroTitle = document.getElementById('heroTitleInput').value;
      const heroSubtitle = document.getElementById('heroSubtitleInput').value;
      const whatsapp = document.getElementById('whatsappInput').value;
      const aboutText = document.getElementById('aboutTextInput').value;
      const imageFile = document.getElementById('heroImageFile').files[0];

      let heroImageUrl = null;
      if (imageFile) {
        const fileName = `hero_${Date.now()}_${imageFile.name}`;
        const { error: uploadError } = await _supabase.storage.from('image').upload(fileName, imageFile);
        if (uploadError) {
          alert('خطأ في رفع صورة الهيرو: ' + uploadError.message);
          return;
        }
        const { data: publicURLData } = _supabase.storage.from('image').getPublicUrl(fileName);
        heroImageUrl = publicURLData.publicUrl;
      }

      const updates = [
        { key: 'hero_title', value: heroTitle },
        { key: 'hero_subtitle', value: heroSubtitle },
        { key: 'whatsapp_number', value: whatsapp },
        { key: 'about_text', value: aboutText }
      ];

      if (heroImageUrl) {
        updates.push({ key: 'hero_image', value: heroImageUrl });
      }

      for (let item of updates) {
        await _supabase.from('site_settings').upsert(item);
      }

      alert('تم تحديث إعدادات الموقع بنجاح ولحظياً لكل الزوار!');
    }

    async function addProduct() {
      const name = document.getElementById('productName').value;
      const price = document.getElementById('productPrice').value;
      const discount = document.getElementById('productDiscount').value;
      const details = document.getElementById('productDetails').value;
      const imageFile = document.getElementById('productImageFile').files[0];

      if (!name || !price || !imageFile) {
        alert('الرجاء إدخال اسم المنتج، السعر، واختيار صورة المنتج من الجهاز!');
        return;
      }

      const fileName = `prod_${Date.now()}_${imageFile.name}`;
      const { error: uploadError } = await _supabase.storage.from('image').upload(fileName, imageFile);
      
      if (uploadError) {
        alert('فشل رفع صورة المنتج: ' + uploadError.message);
        return;
      }

      const { data: publicURLData } = _supabase.storage.from('image').getPublicUrl(fileName);
      const imageUrl = publicURLData.publicUrl;

      const { error: dbError } = await _supabase.from('products').insert([
        { name, price, discount, details, image_url: imageUrl }
      ]);

      if (dbError) {
        alert('فشل حفظ المنتج في قاعدة البيانات: ' + dbError.message);
        return;
      }

      alert('تم إضافة المنتج بنجاح وأصبح ظاهراً لجميع الزوار على الموقع فوراً!');
      document.getElementById('productName').value = '';
      document.getElementById('productPrice').value = '';
      document.getElementById('productDiscount').value = '';
      document.getElementById('productDetails').value = '';
      document.getElementById('productImageFile').value = '';
    }
  </script>
</body>
</html>
