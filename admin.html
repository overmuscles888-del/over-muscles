<!-- مكان زرار رفع الصورة -->
<input type="file" id="heroImageInput" accept="image/*">
<button onclick="saveHeroImage()">حفظ الصورة</button>

<script>
// دالة رفع وحفظ الصورة محلياً من الجهاز بدون أخطاء
function saveHeroImage() {
    const fileInput = document.getElementById('heroImageInput');
    if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Image = e.target.result;
            // حفظ الصورة في الـ LocalStorage
            localStorage.setItem('hero_image', base64Image);
            alert('تم حفظ الصورة بنجاح يا أحمد!');
            location.reload();
        };
        reader.readAsDataURL(fileInput.files[0]);
    } else {
        alert('من فضلك اختر صورة الأول!');
    }
}
</script>
